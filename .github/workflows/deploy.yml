name: Deploy site
on:
  push:
    branches: [main]

concurrency: gh-pages-main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: rsync -a --exclude .git --exclude .github --exclude scripts ./ "$RUNNER_TEMP/site/"
      - name: Version asset URLs
        # Pages caches each file for 10 minutes independently; new URLs per deploy keep page, styles and script in step.
        run: |
          v=${GITHUB_SHA::8}
          sed -i -E "s/(style\.css|app\.js)\"/\1?v=$v\"/" "$RUNNER_TEMP/site/index.html"
          sed -i "s/\"foods\.json\"/\"foods.json?v=$v\"/" "$RUNNER_TEMP/site/app.js"
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ${{ runner.temp }}/site
          branch: gh-pages
          clean-exclude: pr-preview # leave open PR previews in place
          force: false
