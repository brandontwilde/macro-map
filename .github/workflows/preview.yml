name: Deploy PR preview
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        if: github.event.action != 'closed'
        run: rsync -a --exclude .git --exclude .github --exclude scripts ./ "$RUNNER_TEMP/site/"
      - name: Version asset URLs
        if: github.event.action != 'closed'
        # Pages caches each file for 10 minutes independently; new URLs per deploy keep page, styles and script in step.
        run: |
          v=${GITHUB_SHA::8}
          sed -i -E "s/(style\.css|app\.js)\"/\1?v=$v\"/" "$RUNNER_TEMP/site/index.html"
          sed -i "s/\"foods\.json\"/\"foods.json?v=$v\"/" "$RUNNER_TEMP/site/app.js"
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ${{ runner.temp }}/site
